services:
  web:
    build:
      context: .
      args:
        # Se leen del archivo .env (cópialo desde .env.example y pon tus valores)
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Falta VITE_SUPABASE_URL. Copia .env.example como .env y completa tus valores}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Falta VITE_SUPABASE_PUBLISHABLE_KEY. Copia .env.example como .env y completa tus valores}
    image: skillverse-web
    container_name: skillverse
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
